name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e . numpy soundfile openai python-dotenv pydantic requests httpx ruff
      - name: Lint
        run: ruff check .
      - name: Regression checks without model calls
        run: python -m unittest discover -s tests -v
      - name: Check installation and command construction
        run: |
          harmony --help
          harmony config
          harmony run --input example.wav --instruction "Make the voice quieter." --output-dir outputs/check --dry-run
